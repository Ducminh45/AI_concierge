<input id="chat-input" class="flex-1 bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-surface placeholder-outline" placeholder="Nhập tin nhắn..." type="text"/>
<button class="p-3 text-outline hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">mic</span>
</button>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>

<script>
(function () {
  const input = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send-btn');
  const history = document.getElementById('chat-history');
  const sessionId = 'concierge-' + Math.random().toString(36).slice(2, 10);

  function bubble(role, text) {
    const wrap = document.createElement('div');
    if (role === 'user') {
      wrap.className = 'flex items-start space-x-4 justify-end';
      wrap.innerHTML = '<div class="gold-gradient p-4 px-6 rounded-xl rounded-tr-none shadow-sm max-w-[80%]"><p class="font-body-md text-body-md text-white leading-relaxed"></p></div>';
      wrap.querySelector('p').textContent = text;
    } else {
      wrap.className = 'flex items-start space-x-4';
      wrap.innerHTML = '<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center border border-outline-variant/30 flex-shrink-0 shadow-sm"><span class="material-symbols-outlined text-primary" style="font-variation-settings: \'FILL\' 1;">spa</span></div><div class="glass-panel p-6 rounded-xl rounded-tl-none border-l-4 border-l-primary shadow-sm max-w-[80%]"><p class="font-body-md text-body-md text-on-surface leading-relaxed"></p></div>';
      wrap.querySelector('.glass-panel p').textContent = text;
    }
    history.appendChild(wrap);
    wrap.scrollIntoView({ behavior: 'smooth', block: 'end' });
    return wrap;
  }

  async function send(text) {
    text = (text || '').trim();
    if (!text) return;
    bubble('user', text);
    input.value = '';
    const thinking = bubble('ai', '…');
    const target = thinking.querySelector('.glass-panel p');
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: sessionId })
      });
      const data = await res.json();
      target.textContent = data.reply || 'Xin lỗi, hiện chưa có phản hồi.';
    } catch (e) {
      target.textContent = 'Lỗi kết nối máy chủ. Vui lòng thử lại.';
    }
  }

  sendBtn.addEventListener('click', () => send(input.value));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); send(input.value); }
  });
  document.querySelectorAll('.quick-chip').forEach((chip) =>
    chip.addEventListener('click', () => send(chip.textContent))
  );
})();
</script>
